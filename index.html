<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta author="Lucas Bubner, libraries from JS-DOS" />
    <title>DOS Game Emulator - ich</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>

</head>

<body>

    <h2>Push Notifications</h2>
    <button id="enable-notifications">Enable Push Notifications</button>
    <p>Your FCM Token:</p>
    <pre id="token-display" style="word-wrap: break-word; white-space: pre-wrap;">Requesting token...</pre>

    <hr>

    <h2>Stored Files</h2>
    <div id="fileList"></div>

    <hr>

    <iframe id="ichJsDos" width="100%" height="600" src="https://player.dosgameplayer.com/dosxgameplayer?romko=sam5pk.jsdos" frameborder="no" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" scrolling="no"></iframe>

    <hr>
    <!-- Custom Supabase Logic -->
    <script src="supabase.js"></script>
    <!-- Custom Firebase Logic -->
    <script src="firebase.js"></script>

    <h2>Upload File</h2>
    <input type="file" id="fileInput" />
    <button onclick="uploadFile()">Upload</button>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
